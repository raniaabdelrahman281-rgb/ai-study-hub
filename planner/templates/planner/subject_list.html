{% extends "base.html" %}
{% block title %}Subjects{% endblock %}
{% block content %}
<div class="page-header"><h1>📚 Subjects</h1></div>

<div class="card" style="max-width:420px;">
    <h3>Add a subject</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Add</button>
    </form>
</div>

<div class="item-list">
    {% for subject in subjects %}
    <div class="item-row">
        <div class="item-title">
            <span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:{{ subject.color }};margin-right:6px;"></span>
            {{ subject.name }}
        </div>
        <form method="post" action="{% url 'planner:subject_delete' subject.pk %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
        </form>
    </div>
    {% empty %}
    <p class="item-meta">No subjects yet.</p>
    {% endfor %}
</div>
{% endblock %}
