{% extends "base.html" %}
{% block title %}Summarize Notes{% endblock %}
{% block content %}
<div class="page-header"><h1>✂️ Summarize {% if note %}"{{ note.title }}"{% endif %}</h1></div>

<form method="post" class="card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Summarize</button>
</form>

{% if result %}
<div class="card">
    <h3>Summary</h3>
    <div style="white-space:pre-wrap;">{{ result }}</div>
</div>
{% endif %}
{% endblock %}
