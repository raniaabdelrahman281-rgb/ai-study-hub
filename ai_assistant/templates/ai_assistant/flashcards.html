{% extends "base.html" %}
{% block title %}Generate Flashcards{% endblock %}
{% block content %}
<div class="page-header"><h1>🃏 Generate Flashcards</h1></div>

<form method="post" class="card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Generate</button>
</form>

{% if result %}
<div class="card">
    <h3>Flashcards</h3>
    <div style="white-space:pre-wrap;">{{ result }}</div>
</div>
{% endif %}
{% endblock %}
