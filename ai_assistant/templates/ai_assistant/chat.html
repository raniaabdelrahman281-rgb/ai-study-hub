{% extends "base.html" %}
{% block title %}AI Chat{% endblock %}
{% block content %}
<div class="page-header"><h1>💬 Chat Assistant</h1></div>

<div class="card">
    {% for c in history reversed %}
        <div class="chat-bubble chat-user">{{ c.prompt }}</div>
        <div class="chat-bubble chat-ai">{{ c.response }}</div>
    {% endfor %}
    {% if reply %}
        <div class="chat-bubble chat-ai">{{ reply }}</div>
    {% endif %}
</div>

<form method="post" class="card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Send</button>
</form>
{% endblock %}
