{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
    <h1>Set a new password</h1>
    {% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Change password</button>
    </form>
    {% else %}
    <p>This reset link is invalid, possibly because it has already been used.</p>
    {% endif %}
</div>
{% endblock %}
