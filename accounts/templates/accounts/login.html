{% extends "base.html" %}
{% block title %}Login - AI Study Hub{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto;">
    <h1>Welcome back</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Login</button>
    </form>
    <p style="margin-top:14px;">
        <a href="{% url 'accounts:password_reset' %}">Forgot password?</a> ·
        No account? <a href="{% url 'accounts:register' %}">Register</a>
    </p>
</div>
{% endblock %}
