{% extends "base.html" %}
{% block title %}Register - AI Study Hub{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto;">
    <h1>Create your account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Register</button>
    </form>
    <p style="margin-top:14px;">Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
</div>
{% endblock %}
