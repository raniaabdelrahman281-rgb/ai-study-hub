{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
    <h1>Reset Password</h1>
    <p class="item-meta">Enter your email and we'll send you a reset link.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Send reset link</button>
    </form>
</div>
{% endblock %}
